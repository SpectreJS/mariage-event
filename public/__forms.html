<!doctype html>
<html lang="fr">
  <body>
    <!-- Squelette statique pour la détection des formulaires par Netlify -->
    <form name="devis" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="devis" />
      <input name="nom" />
      <input name="email" type="email" />
      <input name="telephone" />
      <input name="type" />
      <input name="date" />
      <input name="invites" />
      <input name="lieu" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
